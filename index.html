<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바다로 가는 대중교통 길찾기 서비스</title>
  
  <!-- CSS 스타일 정의 -->
  <style>
    /* 전체 기본 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    }

    /* 메인 컨테이너 (좌우 2분할) */
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 사이드바 */
    .sidebar {
      width: 420px;
      height: 100%;
      background-color: #ffffff;
      border-right: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0,0,0,0.08);
      position: relative;
    }

    /* 헤더 타이틀 */
    .sidebar-header {
      padding: 16px 20px 10px 20px;
      background-color: #0b528f;
      color: #ffffff;
    }
    .sidebar-header h2 {
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* 검색 입력 영역 */
    .search-section {
      padding: 15px 20px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      position: relative;
    }

    .input-field-group {
      margin-bottom: 10px;
      position: relative;
    }
    .input-field-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #495057;
      margin-bottom: 4px;
    }
    .input-field-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .input-field-group input:focus {
      border-color: #0b528f;
      box-shadow: 0 0 0 2px rgba(11, 82, 143, 0.2);
    }

    /* 실시간 검색어 추천 드롭다운 */
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #ced4da;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      list-style: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: none;
    }
    .autocomplete-item {
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f1f3f5;
    }
    .autocomplete-item:hover {
      background-color: #e7f5ff;
      color: #0b528f;
    }

    /* 도착 바다 카테고리 선택 영역 */
    .category-select-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .category-select-group select {
      flex: 1;
      padding: 8px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 12px;
      background-color: #fff;
      color: #333;
    }

    /* 드롭다운 내 제목 옵션 연한 회색 설정 */
    .category-select-group select option.select-title {
      color: #868e96;
      font-style: italic;
    }

    /* 길찾기 버튼 */
    .search-submit-btn {
      width: 100%;
      padding: 10px;
      background-color: #0b528f;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.2s;
    }
    .search-submit-btn:hover {
      background-color: #073863;
    }

    /* 탭 메뉴 */
    .tab-menu {
      display: flex;
      background-color: #e9ecef;
      border-bottom: 1px solid #dee2e6;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #ffffff;
      color: #0b528f;
      border-bottom: 3px solid #0b528f;
    }

    /* 결과 스크롤 목록 */
    .route-results {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0;
    }

    /* 추천 경로 카드 */
    .route-card {
      padding: 16px 20px;
      border-bottom: 1px solid #e9ecef;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .route-card:hover {
      background-color: #f1f3f5;
    }
    .route-card.selected {
      background-color: #e7f5ff;
      border-left: 4px solid #0b528f;
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .route-time {
      font-size: 18px;
      font-weight: bold;
      color: #0b528f;
    }
    .route-cost {
      font-size: 14px;
      font-weight: bold;
      color: #495057;
    }
    .route-vehicles {
      font-size: 13px;
      color: #212529;
      margin-bottom: 6px;
    }

    /* 상세 경로 박스 */
    .route-details {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #ced4da;
      font-size: 13px;
    }
    .detail-section-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }
    .step-list {
      list-style: none;
      padding-left: 0;
      margin-bottom: 10px;
    }
    .step-item {
      position: relative;
      padding-left: 18px;
      margin-bottom: 6px;
      line-height: 1.4;
      color: #495057;
    }
    .step-item::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #0b528f;
      font-weight: bold;
    }

    .info-breakdown {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .info-breakdown div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* 범례 안내 박스 */
    .map-legend {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 5;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      font-size: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .legend-color {
      width: 16px;
      height: 4px;
      border-radius: 2px;
    }

    /* 안내 메시지 */
    .info-message {
      padding: 30px 20px;
      text-align: center;
      color: #6c757d;
      font-size: 14px;
    }
  </style>

  <!-- 카카오맵 JavaScript SDK -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d8c84161010ceb49246e8f88eb4d70a6&libraries=services"></script>
</head>
<body>

  <div class="container">
    <!-- 왼쪽 사이드바 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>🌊 바다 대중교통 길찾기</h2>
      </div>

      <!-- 검색 영역 -->
      <div class="search-section">
        <!-- 1. 출발점 입력 -->
        <div class="input-field-group">
          <label for="originInput">🚀 출발점 (건물명, 도로명 주소 등)</label>
          <input type="text" id="originInput" placeholder="예: 서울역, 왕십리역" autocomplete="off">
          <ul id="originAutocomplete" class="autocomplete-list"></ul>
        </div>

        <!-- 2. 도착 바다 입력 -->
        <div class="input-field-group">
          <label for="destinationInput">🏖️ 도착 바다 (검색 또는 카테고리 선택)</label>
          <input type="text" id="destinationInput" placeholder="예: 경포해수욕장, 해운대" autocomplete="off">
          <ul id="destinationAutocomplete" class="autocomplete-list"></ul>

          <!-- 도착바다 2단계 카테고리 -->
          <div class="category-select-group">
            <select id="regionPrimarySelect" onchange="handlePrimaryRegionChange()">
              <option value="" class="select-title">① 지역 선택</option>
            </select>
            <select id="seaSecondarySelect" onchange="handleSecondarySeaChange()">
              <option value="" class="select-title">② 해변 선택</option>
            </select>
          </div>
        </div>

        <button class="search-submit-btn" onclick="searchRoutes()">대중교통 경로 찾기</button>
      </div>

      <!-- 대중교통 탭 -->
      <div class="tab-menu">
        <button id="tabSubway" class="tab-btn active" onclick="switchTab('SUBWAY')">🚇 지하철/경전철로만 가기</button>
        <button id="tabMulti" class="tab-btn" onclick="switchTab('MULTI')">🚆 여러 교통 수단으로 가기</button>
      </div>

      <!-- 경로 결과 목록 -->
      <ul id="routeResultsList" class="route-results">
        <li class="info-message">출발지와 도착 바다를 설정한 후 경로를 검색해주세요.</li>
      </ul>
    </div>

    <!-- 오른쪽 지도 영역 -->
    <div class="map-container">
      <div id="map"></div>

      <!-- 경로 선 범례 -->
      <div class="map-legend">
        <div class="legend-item"><div class="legend-color" style="background:#ff922b;"></div> 도보 (주황)</div>
        <div class="legend-item"><div class="legend-color" style="background:#339af0;"></div> 시내버스 (파랑)</div>
        <div class="legend-item"><div class="legend-color" style="background:#845ef7;"></div> 지하철 (보라)</div>
        <div class="legend-item"><div class="legend-color" style="background:#e03131;"></div> KTX / 기차 (빨강)</div>
        <div class="legend-item"><div class="legend-color" style="background:#212529;"></div> 고속/시외버스 (검정)</div>
      </div>
    </div>
  </div>

  <script>
    // 전역 변수
    let mapObject = null;
    let placesService = null;
    let infoWindowObject = null;

    let selectedOriginLocation = null;
    let selectedDestinationLocation = null;

    let currentTabMode = 'SUBWAY';
    let currentMapMarkers = [];
    let currentMapPolylines = [];

    // 카테고리 데이터
    const SEA_CATEGORY_DATA = {
      "강원도": ["경포해수욕장", "속초해수욕장", "낙산해수욕장", "안목해변", "양양 서피비치"],
      "경기도": ["제부도 해수욕장", "궁평리해수욕장", "방아머리해변"],
      "충청남도": ["대천해수욕장", "꽃지해수욕장", "만리포해수욕장"],
      "전라남도": ["여수 만성리검은모래해변", "완도 명사십리해수욕장", "여수 모사금해수욕장"],
      "경상북도": ["포항 영일대해수욕장", "영덕 영래해변", "경주 오류고아라해변"],
      "경상남도": ["거제 학동몽돌해수욕장", "남해 상주은모래비치", "통영 비진도해수욕장"],
      "전북특별자치도": ["변산해수욕장", "선유도해수욕장"],
      "충청북도": ["충주호 (내륙 호수)"],
      "제주특별자치도": ["협재해수욕장", "함덕해수욕장", "중문색달해변", "월정리해변"]
    };

    // 카카오맵 초기화
    kakao.maps.load(function() {
      const mapContainer = document.getElementById('map');
      const mapOptions = {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 6
      };

      mapObject = new kakao.maps.Map(mapContainer, mapOptions);
      placesService = new kakao.maps.services.Places();
      infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 10 });

      setupAutocomplete('originInput', 'originAutocomplete', function(place) {
        selectedOriginLocation = place;
      });
      setupAutocomplete('destinationInput', 'destinationAutocomplete', function(place) {
        selectedDestinationLocation = place;
      });

      initCategoryOptions();
    });

    // 검색어 추천 (자동완성)
    function setupAutocomplete(inputId, listId, onSelectCallback) {
      const inputEl = document.getElementById(inputId);
      const listEl = document.getElementById(listId);

      inputEl.addEventListener('input', function() {
        const query = this.value.trim();
        if (!query) {
          listEl.style.display = 'none';
          return;
        }

        placesService.keywordSearch(query, function(data, status) {
          if (status === kakao.maps.services.Status.OK) {
            listEl.innerHTML = '';
            data.slice(0, 5).forEach(place => {
              const item = document.createElement('li');
              item.className = 'autocomplete-item';
              item.textContent = `${place.place_name} (${place.address_name})`;
              item.onclick = function() {
                inputEl.value = place.place_name;
                listEl.style.display = 'none';
                onSelectCallback({
                  name: place.place_name,
                  address: place.road_address_name || place.address_name,
                  lat: parseFloat(place.y),
                  lng: parseFloat(place.x)
                });
              };
              listEl.appendChild(item);
            });
            listEl.style.display = 'block';
          } else {
            listEl.style.display = 'none';
          }
        });
      });

      document.addEventListener('click', function(e) {
        if (e.target !== inputEl) {
          listEl.style.display = 'none';
        }
      });
    }

    // 도착 바다 카테고리 옵션 생성
    function initCategoryOptions() {
      const primarySelect = document.getElementById('regionPrimarySelect');
      Object.keys(SEA_CATEGORY_DATA).forEach(region => {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region;
        primarySelect.appendChild(option);
      });
    }

    function handlePrimaryRegionChange() {
      const primarySelect = document.getElementById('regionPrimarySelect');
      const secondarySelect = document.getElementById('seaSecondarySelect');
      const selectedRegion = primarySelect.value;

      secondarySelect.innerHTML = '<option value="" class="select-title">② 해변 선택</option>';

      if (selectedRegion && SEA_CATEGORY_DATA[selectedRegion]) {
        SEA_CATEGORY_DATA[selectedRegion].forEach(seaName => {
          const option = document.createElement('option');
          option.value = seaName;
          option.textContent = seaName;
          secondarySelect.appendChild(option);
        });
      }
    }

    function handleSecondarySeaChange() {
      const secondarySelect = document.getElementById('seaSecondarySelect');
      const seaName = secondarySelect.value;

      if (seaName) {
        document.getElementById('destinationInput').value = seaName;
        placesService.keywordSearch(seaName, function(data, status) {
          if (status === kakao.maps.services.Status.OK) {
            const place = data[0];
            selectedDestinationLocation = {
              name: place.place_name,
              address: place.road_address_name || place.address_name,
              lat: parseFloat(place.y),
              lng: parseFloat(place.x)
            };
          }
        });
      }
    }

    // 탭 전환
    function switchTab(mode) {
      if (currentTabMode === mode) return;

      currentTabMode = mode;
      document.getElementById('tabSubway').classList.toggle('active', mode === 'SUBWAY');
      document.getElementById('tabMulti').classList.toggle('active', mode === 'MULTI');

      clearMapGraphics();
      if (selectedOriginLocation && selectedDestinationLocation) {
        renderRouteList();
      }
    }

    // 길찾기 실행
    function searchRoutes() {
      const originVal = document.getElementById('originInput').value.trim();
      const destVal = document.getElementById('destinationInput').value.trim();

      if (!originVal || !destVal) {
        alert('출발지와 도착 바다를 모두 입력해 주세요!');
        return;
      }

      if (!selectedOriginLocation || selectedOriginLocation.name !== originVal) {
        placesService.keywordSearch(originVal, function(data, status) {
          if (status === kakao.maps.services.Status.OK) {
            const p = data[0];
            selectedOriginLocation = { name: p.place_name, address: p.address_name, lat: parseFloat(p.y), lng: parseFloat(p.x) };
            checkAndRender();
          } else {
            alert('출발지 장소를 찾을 수 없습니다.');
          }
        });
      } else {
        checkAndRender();
      }

      if (!selectedDestinationLocation || selectedDestinationLocation.name !== destVal) {
        placesService.keywordSearch(destVal, function(data, status) {
          if (status === kakao.maps.services.Status.OK) {
            const p = data[0];
            selectedDestinationLocation = { name: p.place_name, address: p.address_name, lat: parseFloat(p.y), lng: parseFloat(p.x) };
            checkAndRender();
          } else {
            alert('도착 바다 장소를 찾을 수 없습니다.');
          }
        });
      } else {
        checkAndRender();
      }
    }

    function checkAndRender() {
      if (selectedOriginLocation && selectedDestinationLocation) {
        clearMapGraphics();
        renderRouteList();
      }
    }

    // 자연스러운 곡선 좌표 생성 함수 (지형 및 도로망 모방)
    function generateCurvedPath(startPt, endPt, curvature = 0.15, numPoints = 25) {
      const points = [];
      const midLat = (startPt.lat + endPt.lat) / 2;
      const midLng = (startPt.lng + endPt.lng) / 2;

      // 직각 방향의 오프셋 계산 (직선이나 바다를 뚫지 않도록 곡선 우회 제어)
      const dx = endPt.lng - startPt.lng;
      const dy = endPt.lat - startPt.lat;
      
      const controlLat = midLat - dx * curvature;
      const controlLng = midLng + dy * curvature;

      // 2차 베지에 곡선(Quadratic Bezier Curve) 공식으로 유연한 도로망 선 생성
      for (let i = 0; i <= numPoints; i++) {
        const t = i / numPoints;
        const lat = (1 - t) * (1 - t) * startPt.lat + 2 * (1 - t) * t * controlLat + t * t * endPt.lat;
        const lng = (1 - t) * (1 - t) * startPt.lng + 2 * (1 - t) * t * controlLng + t * t * endPt.lng;
        points.push({ lat, lng });
      }
      return points;
    }

    // 추천 경로 데이터 생성 (KTX, 무궁화호, 고속버스, 시내버스, 지하철 포함)
    function generateMockRoutes(mode, origin, dest) {
      const o = origin;
      const d = dest;

      if (mode === 'SUBWAY') {
        // [탭 1: 지하철/경전철]
        const p1 = { lat: o.lat + (d.lat - o.lat) * 0.1, lng: o.lng + (d.lng - o.lng) * 0.1 };
        const p2 = { lat: o.lat + (d.lat - o.lat) * 0.85, lng: o.lng + (d.lng - o.lng) * 0.85 };

        return [
          {
            totalTime: 85,
            totalCost: 2850,
            vehiclesSummary: "지하철 1호선 ➔ 수인분당선 ➔ 도보",
            steps: [
              `[출발] ${o.name} 출발`,
              `도보 5분 이동 ➔ 가까운 지하철역 탑승`,
              `지하철 1호선 탑승 (12개 역 이동)`,
              `환승역에서 수인분당선 환승`,
              `해안 인근 지하철역 하차`,
              `[도착] 바다까지 도보 15분 이동 ➔ ${d.name}`
            ],
            timeBreakdown: { walk: 20, bus: 0, train: 0, subway: 65 },
            costBreakdown: { bus: 0, subway: 2850, train: 0 },
            segments: [
              { type: 'WALK', path: generateCurvedPath(o, p1, 0.05, 5) },
              { type: 'SUBWAY', path: generateCurvedPath(p1, p2, 0.25, 30) },
              { type: 'WALK', path: generateCurvedPath(p2, d, -0.05, 8) }
            ]
          },
          {
            totalTime: 95,
            totalCost: 3200,
            vehiclesSummary: "지하철 2호선 ➔ 경전철 ➔ 도보",
            steps: [
              `[출발] ${o.name} 출발`,
              `도보 8분 이동 ➔ 지하철 2호선 탑승`,
              `지하철 2호선 (8개 역 이동) ➔ 경전철 환승`,
              `경전철 종점 하차`,
              `[도착] 바다 방향으로 도보 18분 이동 ➔ ${d.name}`
            ],
            timeBreakdown: { walk: 26, bus: 0, train: 0, subway: 69 },
            costBreakdown: { bus: 0, subway: 3200, train: 0 },
            segments: [
              { type: 'WALK', path: generateCurvedPath(o, p1, -0.05, 5) },
              { type: 'SUBWAY', path: generateCurvedPath(p1, p2, -0.22, 30) },
              { type: 'WALK', path: generateCurvedPath(p2, d, 0.05, 8) }
            ]
          }
        ];
      } else {
        // [탭 2: 여러 교통 수단 - KTX, 무궁화호, 고속버스, 버스 등 총동원]
        const p1 = { lat: o.lat + (d.lat - o.lat) * 0.15, lng: o.lng + (d.lng - o.lng) * 0.15 };
        const p2 = { lat: o.lat + (d.lat - o.lat) * 0.75, lng: o.lng + (d.lng - o.lng) * 0.75 };

        return [
          {
            totalTime: 65,
            totalCost: 18400,
            vehiclesSummary: "지하철 ➔ KTX(고속철도) ➔ 시내버스 ➔ 도보",
            steps: [
              `[출발] ${o.name} 출발`,
              `지하철 이동 ➔ KTX 기차역 도착`,
              `KTX 고속철도 탑승 (인근 역 이동)`,
              `해안 인근 역 하차 ➔ 301번 시내버스 탑승`,
              `[도착] 해수욕장 입구 하차 후 도보 4분 ➔ ${d.name}`
            ],
            timeBreakdown: { walk: 9, bus: 15, train: 30, subway: 11 },
            costBreakdown: { bus: 1500, subway: 1400, train: 15500 },
            segments: [
              { type: 'SUBWAY', path: generateCurvedPath(o, p1, 0.1, 10) },
              { type: 'TRAIN', path: generateCurvedPath(p1, p2, -0.3, 35) },
              { type: 'BUS', path: generateCurvedPath(p2, { lat: d.lat - 0.003, lng: d.lng - 0.003 }, 0.15, 15) },
              { type: 'WALK', path: generateCurvedPath({ lat: d.lat - 0.003, lng: d.lng - 0.003 }, d, 0.02, 5) }
            ]
          },
          {
            totalTime: 110,
            totalCost: 12100,
            vehiclesSummary: "시내버스 ➔ 무궁화호 기차 ➔ 고속버스",
            steps: [
              `[출발] ${o.name} 출발`,
              `시내버스 탑승 ➔ 기차역 이동`,
              `무궁화호 탑승 ➔ 터미널 인근 역 하차`,
              `시외/고속버스 환승 ➔ 바다 인근 터미널 하차`,
              `[도착] 도보 8분 이동 ➔ ${d.name}`
            ],
            timeBreakdown: { walk: 12, bus: 35, train: 63, subway: 0 },
            costBreakdown: { bus: 1500, subway: 0, train: 10600 },
            segments: [
              { type: 'BUS', path: generateCurvedPath(o, p1, -0.15, 12) },
              { type: 'TRAIN', path: generateCurvedPath(p1, p2, 0.35, 35) },
              { type: 'EXPRESS', path: generateCurvedPath(p2, { lat: d.lat - 0.004, lng: d.lng - 0.004 }, -0.1, 15) },
              { type: 'WALK', path: generateCurvedPath({ lat: d.lat - 0.004, lng: d.lng - 0.004 }, d, 0.01, 5) }
            ]
          }
        ];
      }
    }

    // 추천 경로 UI 출력
    function renderRouteList() {
      const listEl = document.getElementById('routeResultsList');
      listEl.innerHTML = '';

      const mockRoutes = generateMockRoutes(currentTabMode, selectedOriginLocation, selectedDestinationLocation);

      mockRoutes.forEach((route, index) => {
        const card = document.createElement('li');
        card.className = 'route-card';

        card.innerHTML = `
          <div class="route-header">
            <span class="route-time">⏱️ 약 ${route.totalTime}분</span>
            <span class="route-cost">💳 ${route.totalCost.toLocaleString()}원</span>
          </div>
          <div class="route-vehicles"><strong>이용 수단:</strong> ${route.vehiclesSummary}</div>
        `;

        card.onclick = function() {
          document.querySelectorAll('.route-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');

          document.querySelectorAll('.route-details').forEach(d => d.remove());

          const detailBox = document.createElement('div');
          detailBox.className = 'route-details';
          detailBox.innerHTML = `
            <div class="detail-section-title">📍 구체적 이동 경로 (환승 정보)</div>
            <ul class="step-list">
              ${route.steps.map(step => `<li class="step-item">${step}</li>`).join('')}
            </ul>

            <div class="detail-section-title">📊 소요 시간 자세히 보기</div>
            <div class="info-breakdown">
              <div><span>🚶 도보:</span> <strong>${route.timeBreakdown.walk}분</strong></div>
              <div><span>🚌 버스:</span> <strong>${route.timeBreakdown.bus}분</strong></div>
              <div><span>🚆 KTX/기차:</span> <strong>${route.timeBreakdown.train}분</strong></div>
              <div><span>🚇 지하철:</span> <strong>${route.timeBreakdown.subway}분</strong></div>
            </div>

            <div class="detail-section-title">💰 예상 비용 자세히 보기</div>
            <div class="info-breakdown">
              <div><span>버스 요금:</span> <strong>${route.costBreakdown.bus.toLocaleString()}원</strong></div>
              <div><span>지하철 요금:</span> <strong>${route.costBreakdown.subway.toLocaleString()}원</strong></div>
              <div><span>KTX / 기차 / 고속버스:</span> <strong>${route.costBreakdown.train.toLocaleString()}원</strong></div>
            </div>
          `;

          card.appendChild(detailBox);
          drawRouteOnMap(route);
        };

        listEl.appendChild(card);
      });
    }

    // 지도상에 마커 및 구간별 색상 경로 표시
    function drawRouteOnMap(route) {
      clearMapGraphics();
      const bounds = new kakao.maps.LatLngBounds();

      // 출발지 마커
      const originLatLng = new kakao.maps.LatLng(selectedOriginLocation.lat, selectedOriginLocation.lng);
      const originMarker = new kakao.maps.Marker({ position: originLatLng, map: mapObject });
      currentMapMarkers.push(originMarker);
      bounds.extend(originLatLng);

      kakao.maps.event.addListener(originMarker, 'click', function() {
        showInfoWindow(originMarker, `🚀 [출발지] ${selectedOriginLocation.name}`, selectedOriginLocation.address);
      });

      // 도착 바다 마커
      const destLatLng = new kakao.maps.LatLng(selectedDestinationLocation.lat, selectedDestinationLocation.lng);
      const destMarker = new kakao.maps.Marker({ position: destLatLng, map: mapObject });
      currentMapMarkers.push(destMarker);
      bounds.extend(destLatLng);

      kakao.maps.event.addListener(destMarker, 'click', function() {
        showInfoWindow(destMarker, `🏖️ [도착 바다] ${selectedDestinationLocation.name}`, selectedDestinationLocation.address);
      });

      // 구간별 경로 선 (Polyline) 생성
      route.segments.forEach(seg => {
        let lineColor = '#ff922b';
        let lineStyle = 'solid';

        if (seg.type === 'WALK') {
          lineColor = '#ff922b'; // 주황 (도보)
          lineStyle = 'dash';
        } else if (seg.type === 'BUS') {
          lineColor = '#339af0'; // 파랑 (시내버스)
        } else if (seg.type === 'SUBWAY') {
          lineColor = '#845ef7'; // 보라 (지하철)
        } else if (seg.type === 'TRAIN') {
          lineColor = '#e03131'; // 빨강 (KTX/기차)
        } else if (seg.type === 'EXPRESS') {
          lineColor = '#212529'; // 검정 (고속버스)
        }

        const pathPoints = seg.path.map(pt => {
          const latLng = new kakao.maps.LatLng(pt.lat, pt.lng);
          bounds.extend(latLng);
          return latLng;
        });

        const polyline = new kakao.maps.Polyline({
          map: mapObject,
          path: pathPoints,
          strokeWeight: 6,
          strokeColor: lineColor,
          strokeOpacity: 0.85,
          strokeStyle: lineStyle
        });

        currentMapPolylines.push(polyline);
      });

      mapObject.setBounds(bounds);
    }

    // 팝업 표시
    function showInfoWindow(marker, title, address) {
      const content = `
        <div style="padding:10px;font-size:12px;min-width:180px;">
          <strong style="color:#0b528f;font-size:13px;">${title}</strong><br/>
          <span style="color:#666;margin-top:4px;display:block;">${address || '주소 정보 없음'}</span>
        </div>
      `;
      infoWindowObject.setContent(content);
      infoWindowObject.open(mapObject, marker);
    }

    // 지도 상 그래픽 제거
    function clearMapGraphics() {
      currentMapMarkers.forEach(m => m.setMap(null));
      currentMapMarkers = [];

      currentMapPolylines.forEach(p => p.setMap(null));
      currentMapPolylines = [];

      if (infoWindowObject) infoWindowObject.close();
    }
  </script>
